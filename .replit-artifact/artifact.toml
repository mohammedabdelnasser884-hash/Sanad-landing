kind = "web"
previewPath = "/"
title = "سند - الموقع الرسمي"
version = "1.0.0"
id = "artifacts/sanad-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25343

[services.development]
run = "pnpm --filter @workspace/sanad-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sanad-website", "run", "build" ]
publicDir = "artifacts/sanad-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25343"
BASE_PATH = "/"
